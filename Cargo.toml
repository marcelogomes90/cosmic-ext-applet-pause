[package]
name = "cosmic-ext-applet-pause"
version = "1.1.1"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "Small break reminders for the COSMIC desktop"
repository = "https://github.com/marcelogomes90/cosmic-ext-applet-pause"
homepage = "https://github.com/marcelogomes90/cosmic-ext-applet-pause"
readme = "README.md"

[lib]
name = "cosmic_ext_applet_pause"
path = "src/lib.rs"

[[bin]]
name = "cosmic-ext-applet-pause"
path = "src/main.rs"

[[bin]]
name = "cosmic-ext-applet-pause-dump"
path = "src/bin/pause_dump.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[dependencies]
futures = "0.3"
i18n-embed-fl = "0.10"
jiff = "0.2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.14", default-features = false, features = ["tokio"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = [
    "applet",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[profile.release]
lto = "thin"
opt-level = 2
